services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "track_io_timing=on"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  demo-app:
    build: ../demo-app
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/demo
    deploy:
      resources:
        limits:
          memory: 512M

  pgbouncer:
    image: edoburu/pgbouncer
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/demo
      # NOTE: "session" is deliberately the wrong pool mode for this
      # workload -- a test case for Vigil to recommend "transaction" instead.
      POOL_MODE: session
      MAX_CLIENT_CONN: 100
    ports:
      - "6432:6432"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 512M

  # TODO: add once collector has real code
  # collector:
  #   build: ../collector
  #   depends_on:
  #     - postgres

  # TODO: add once brain has real code
  # brain:
  #   build: ../brain
  #   depends_on:
  #     - postgres

volumes:
  pgdata:
