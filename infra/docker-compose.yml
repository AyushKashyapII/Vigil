services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: demo
    ports:
      - "5432:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "track_io_timing=on"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

  demo-app:
    build: ../demo-app
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/demo
      # --- OpenTelemetry (read by opentelemetry-instrument, see Dockerfile) ---
      OTEL_SERVICE_NAME: vigil-demo-app
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev
      # SigNoz runs as its own compose project (installed via Foundry, see
      # infra/signoz/). demo-app joins SigNoz's network (below) and talks to
      # the ingester by its service name. Going via the host's published
      # port (host.docker.internal + host-gateway) was tried first and got
      # "connection refused" from inside the container.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-ingester:4317}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      # Logs are out of scope for Phase 0 -- traces are the point here.
      OTEL_LOGS_EXPORTER: none
      # SQLAlchemy and psycopg2 instrumentation would BOTH record every
      # query (two spans per statement). Keep SQLAlchemy's -- it's the layer
      # the app actually talks to. Remove this line to see the duplication.
      OTEL_PYTHON_DISABLED_INSTRUMENTATIONS: psycopg2
    networks:
      - default   # postgres etc.
      - signoz    # SigNoz's ingester
    deploy:
      resources:
        limits:
          memory: 512M

  pgbouncer:
    image: edoburu/pgbouncer
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/demo
      # NOTE: "session" is deliberately the wrong pool mode for this
      # workload -- a test case for Vigil to recommend "transaction" instead.
      POOL_MODE: session
      MAX_CLIENT_CONN: 100
    ports:
      - "6432:6432"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 512M

  collector:
    build: ../collector
    depends_on:
      - postgres
    environment:
      COLLECTOR_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/demo
      COLLECTOR_STORE_PATH: /data/vigil.db
      # --- OpenTelemetry (read by the Go SDK, see internal/telemetry) ---
      OTEL_SERVICE_NAME: vigil-collector
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-ingester:4317}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      # SDK default is 60s. The collector polls every 5s, so a 60s export
      # would make every gauge a coarse 1-minute step on the dashboard.
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    networks:
      - default
      - signoz
    volumes:
      - collector_data:/data
    # Postgres accepting a TCP connection isn't the same as it being ready
    # to serve queries -- depends_on only waits for the container to
    # start. The collector doesn't retry a failed connection (it exits),
    # so this restart policy is what actually gets it running once
    # Postgres is really ready, not any retry logic in the Go code itself.
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 512M

  brain:
    build: ../brain
    depends_on:
      - collector
      - postgres
    environment:
      VIGIL_STORE_PATH: /data/vigil.db
      # A direct connection with CREATEDB, for the sandbox -- a bigger
      # capability than brain has had so far (it's only ever read
      # collector's store). Reuses the same superuser credential as
      # everything else in this dev stack for now; a real deployment
      # would want this scoped to a dedicated sandbox role, separate from
      # collector's ideally-read-only one. See ROADMAP.md.
      SANDBOX_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/demo
      ALEMBIC_VERSIONS_DIR: /alembic-versions
      PROPOSALS_DIR: /proposals
      # From infra/.env, gitignored -- never hardcode a real key here.
      GROQ_API_KEY: ${GROQ_API_KEY}
      # --- OpenTelemetry (read by the Python SDK, see vigil_brain/telemetry.py) ---
      OTEL_SERVICE_NAME: vigil-brain
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://signoz-ingester:4317}
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    networks:
      - default
      - signoz
    volumes:
      # Same volume collector writes vigil.db to, mounted read-only --
      # brain only ever reads the store, never writes to it.
      - collector_data:/data:ro
      # Read-only: brain needs to know the current Alembic head to chain
      # a generated migration onto, never to write here directly.
      - ../demo-app/alembic/versions:/alembic-versions:ro
      # Dry-run PR output (migration file + PR body) -- see ROADMAP.md,
      # actions/pr.py. A real bind mount, not a named volume, so it's
      # readable straight from the host without docker cp.
      - ../proposals:/proposals
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
  collector_data:

networks:
  # Created by SigNoz's own compose project (foundryctl, infra/signoz/) --
  # not by this file. `external` means compose won't create it, so SigNoz
  # must be up BEFORE `docker compose up` here, or this fails fast.
  # Name read off `docker network ls`; SigNoz's docs don't state it.
  signoz:
    external: true
    name: signoz-network
