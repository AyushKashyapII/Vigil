# SigNoz install config for Foundry (SigNoz's installer since v0.130.0 --
# the old deploy/docker compose files in the SigNoz repo are deprecated).
#
#   cd infra/signoz
#   foundryctl cast -f casting.yaml     # generates pours/ and runs docker compose up
#
# UI: http://localhost:8080   OTLP: localhost:4317 (gRPC), localhost:4318 (HTTP)
apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
